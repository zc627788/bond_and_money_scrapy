name: Release Windows exe

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name BondMoneyScrapy
          --add-data "config/settings.json;config"
          --add-data "templates/issuers_template.csv;templates"
          gui_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: BondMoneyScrapy-windows
          path: dist/BondMoneyScrapy.exe
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/BondMoneyScrapy.exe
